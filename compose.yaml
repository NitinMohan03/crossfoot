services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crossfoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crossfoot}
      POSTGRES_DB: ${POSTGRES_DB:-crossfoot}
    ports:
      # 5433 on the host: a native Windows postgres service commonly holds 5432, and when it
      # does it wins host connections silently -- the container is then only reachable through
      # `docker compose exec`. Inside the container the port is still 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crossfoot} -d ${POSTGRES_DB:-crossfoot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
