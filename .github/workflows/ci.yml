name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: crossfoot
          POSTGRES_PASSWORD: crossfoot
          POSTGRES_DB: crossfoot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crossfoot -d crossfoot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://crossfoot:crossfoot@localhost:5432/crossfoot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
