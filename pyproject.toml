[project]
name = "crossfoot"
version = "0.1.0"
description = "Multi-source financial reconciliation: deterministic rules first, LLM only for the residual."
readme = "README.md"
# <3.13: torch / sentence-transformers wheels lag; system Python is 3.14 and must not be picked up.
requires-python = ">=3.12,<3.13"
dependencies = [
    "rapidfuzz>=3.10",
    # Generator only: remittance PDFs, in invariant mode so the bytes are stable (spec 01 §9).
    # Pinned exactly, and `test_remit.py` asserts the pin. `tests/fixtures/golden/dev/` commits
    # ~480 PDFs whose bytes are ground truth; reportlab writes its own version into the `%PDF`
    # header banner, which no public API overrides, so an upgrade shifts every byte offset in
    # every one of those files. Measured 4.2.5 vs 5.1.0: the object bodies are identical once
    # `/Producer` and `/Creator` are set by us -- only that banner and the xref offsets move.
    # An upgrade is therefore a deliberate golden regeneration, not a transitive resolution.
    "reportlab==5.1.0",
    # Windows ships no tz database; zoneinfo needs this for Europe/London (bank sidecar).
    "tzdata>=2024.1",
    # The mock payment processor API (`just proc-api`), which Phase 2.2's client is written against.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Postgres access: the reference-table loader, and every DB-side read from Phase 2.1 on.
    "psycopg[binary]>=3.2",
    "mcp>=2.3.0",
    "pydantic>=2.14.2",
    # `mcp-remittance` only: reads the advice PDFs as positioned text runs, in one module
    # (`mcp/remittance/layout.py`). Not pinned exactly: unlike reportlab it writes no bytes that
    # are committed, and the parse tests compare every field with ground truth on any version.
    "pdfplumber>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
    "mypy>=1.17",
    # Starlette's TestClient transport. httpx2, not httpx: starlette 1.10 deprecates the latter.
    "httpx2>=2.16",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["crossfoot"]

# reportlab ships no type information.
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-rs` so skips are printed: the DB-backed tests skip when Postgres is unreachable, and a green
# run with silent skips is not evidence that they ran.
addopts = "-q -rs"
